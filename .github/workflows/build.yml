name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # iOS builds for a device, which compiles the AR code the Simulator skips.
        platform: [iOS, iOS Simulator, macOS]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          xcodebuild -version
          xcodebuild build \
            -project ALife.xcodeproj \
            -scheme ALife \
            -destination 'generic/platform=${{ matrix.platform }}' \
            CODE_SIGNING_ALLOWED=NO
